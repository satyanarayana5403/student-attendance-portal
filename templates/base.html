<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Nexus Attendance Portal — Smart student and teacher attendance management system">
    <title>{% block title %}Nexus Attendance{% endblock %}</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        {% block extra_css %}{% endblock %}
    </style>
    <script>
        // Apply theme early to prevent flicker
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'light') {
            document.documentElement.setAttribute('data-theme', 'light');
        }
    </script>
</head>
<body {% block body_attrs %}{% endblock %}>
    <div class="ambient ambient-1"></div>
    <div class="ambient ambient-2"></div>

    <div id="page-loader">
        <div class="loader-spinner"></div>
        <div class="loader-text">{% block loader_text %}Loading...{% endblock %}</div>
    </div>

    <!-- Image Adjustment / Cropper Modal -->
    <div class="modal-overlay" id="imageAdjustModal" style="z-index: 10000;">
        <div class="modal" style="max-width: 440px; padding: 24px;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px;">
                <div>
                    <div class="modal-title" style="margin-bottom: 2px;">Adjust Profile Photo</div>
                    <div style="font-size: 12px; color: var(--text-2);">Drag to center, use the slider to zoom, or rotate</div>
                </div>
                <button type="button" class="modal-close" onclick="closeImageAdjustModal()" style="position: static; font-size: 20px;" aria-label="Close">×</button>
            </div>

            <!-- Crop Canvas Container -->
            <div style="display: flex; justify-content: center; margin-bottom: 16px;">
                <div id="cropCanvasWrapper" style="position: relative; width: 320px; height: 320px; border-radius: var(--radius-sm); overflow: hidden; background: #07070b; box-shadow: 0 8px 24px rgba(0,0,0,0.5); cursor: grab; user-select: none; touch-action: none;">
                    <canvas id="cropCanvas" width="320" height="320" style="display: block; width: 100%; height: 100%;"></canvas>
                </div>
            </div>

            <!-- Controls (Zoom, Rotate, Reset) -->
            <div style="background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 12px 14px; margin-bottom: 18px;">
                <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 12px;">
                    <span style="font-size: 11px; font-family: var(--mono); color: var(--text-2); text-transform: uppercase; width: 42px;">Zoom</span>
                    <button type="button" class="btn btn-outline" style="padding: 3px 8px; font-size: 13px; line-height: 1;" onclick="stepCropZoom(-0.1)">−</button>
                    <input type="range" id="cropZoomSlider" min="1.0" max="3.5" step="0.02" value="1.0" style="flex: 1; accent-color: var(--accent); cursor: pointer;" oninput="onCropZoomInput(this.value)">
                    <button type="button" class="btn btn-outline" style="padding: 3px 8px; font-size: 13px; line-height: 1;" onclick="stepCropZoom(0.1)">+</button>
                </div>

                <div style="display: flex; justify-content: space-between; align-items: center; gap: 8px;">
                    <div style="display: flex; gap: 8px;">
                        <button type="button" class="btn btn-outline" style="padding: 6px 12px; font-size: 12px; display: inline-flex; align-items: center; gap: 4px;" onclick="rotateCropImage(-90)" title="Rotate Counter-Clockwise">
                            ↺ 90°
                        </button>
                        <button type="button" class="btn btn-outline" style="padding: 6px 12px; font-size: 12px; display: inline-flex; align-items: center; gap: 4px;" onclick="rotateCropImage(90)" title="Rotate Clockwise">
                            ↻ 90°
                        </button>
                    </div>
                    <button type="button" class="btn btn-outline" style="padding: 6px 12px; font-size: 12px; color: var(--text-2);" onclick="resetCropImage()">
                        ⟲ Reset
                    </button>
                </div>
            </div>

            <!-- Actions -->
            <div style="display: flex; justify-content: flex-end; gap: 10px;">
                <button type="button" class="btn btn-outline" onclick="closeImageAdjustModal()">Cancel</button>
                <button type="button" class="btn btn-primary" onclick="applyCroppedImage()">✓ Apply Photo</button>
            </div>
        </div>
    </div>

    {% block body %}{% endblock %}

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    <script>
        {% block extra_js %}{% endblock %}
    </script>
</body>
</html>
